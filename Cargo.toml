[package]
name = "planeai-plugin-linear"
version = "0.0.0"
edition = "2021"
description = "Linear integration plugin for PlaneAI"
license = "AGPL-3.0-only"

[[bin]]
name = "planeai-plugin-linear"
path = "src/main.rs"

[dependencies]
base64 = "=0.23.1"
chrono = { version = "=0.4.45", features = ["serde"] }
open = "=5.4.5"
rand = "=0.10.3"
reqwest = { version = "=0.13.5", features = ["json", "form"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  "io-util",
  "net",
  "sync",
  "time",
] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
wiremock = "=0.6.5"
