name: Release plugin

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: make test
      - run: make verify-package
      - name: Check version
        id: version
        run: |
          echo "--- auto version raw output ---"
          pnpm exec auto version 2>&1 | tee /tmp/auto-output.txt || true
          echo "--- end raw output ---"
          VERSION=$(tail -1 /tmp/auto-output.txt)
          echo "Parsed VERSION=$VERSION"
          if [[ "$VERSION" == "patch" || "$VERSION" == "minor" || "$VERSION" == "major" ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid version bump detected, skipping release"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: gate
    if: needs.gate.outputs.version != ''
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Determine new version
        id: tag
        shell: bash
        run: |
          BUMP="${{ needs.gate.outputs.version }}"
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT="${CURRENT#v}"
          IFS='.' read -r major minor patch <<< "$CURRENT"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}
      - name: Create draft release
        run: |
          gh release create ${{ steps.tag.outputs.tag }} \
            --draft \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            binary: planeai-plugin-linear
            archive: planeai-plugin-linear-macos-arm64.tar.gz
          - os: macos-15-intel
            platform: macos-x64
            binary: planeai-plugin-linear
            archive: planeai-plugin-linear-macos-x64.tar.gz
          - os: ubuntu-24.04
            platform: linux-x64
            binary: planeai-plugin-linear
            archive: planeai-plugin-linear-linux-x64.tar.gz
          - os: windows-2025
            platform: windows-x64
            binary: planeai-plugin-linear.exe
            archive: planeai-plugin-linear-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: make test
      - name: Inject version
        shell: bash
        run: node scripts/inject-release-version.mjs ${{ needs.release.outputs.tag }}
      - run: cargo build --release
        env:
          # The OAuth app's public client id; without it the build offers only the API key connection.
          LINEAR_CLIENT_ID: ${{ vars.LINEAR_CLIENT_ID }}
      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ROOT="dist/planeai-plugin-linear"
          mkdir -p "$ROOT/bin/${{ matrix.platform }}" "$ROOT/ui"
          cp planeai-plugin.json "$ROOT/"
          cp build/package/ui/preferences.js build/package/ui/sidebar.js build/package/ui/departures.js build/package/ui/assign.js "$ROOT/ui/"
          cp "target/release/${{ matrix.binary }}" "$ROOT/bin/${{ matrix.platform }}/${{ matrix.binary }}"
          chmod +x "$ROOT/bin/${{ matrix.platform }}/${{ matrix.binary }}"
      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'dist/planeai-plugin-linear'
          New-Item -ItemType Directory -Force -Path "$root/bin/${{ matrix.platform }}", "$root/ui" | Out-Null
          Copy-Item planeai-plugin.json "$root/planeai-plugin.json"
          Copy-Item build/package/ui/preferences.js "$root/ui/preferences.js"
          Copy-Item build/package/ui/sidebar.js "$root/ui/sidebar.js"
          Copy-Item build/package/ui/departures.js "$root/ui/departures.js"
          Copy-Item build/package/ui/assign.js "$root/ui/assign.js"
          Copy-Item "target/release/${{ matrix.binary }}" "$root/bin/${{ matrix.platform }}/${{ matrix.binary }}"
      - name: Verify staged package handshake
        run: node scripts/verify-package-handshake.mjs dist/planeai-plugin-linear ${{ matrix.platform }}
      - name: Archive package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "${{ matrix.archive }}" planeai-plugin-linear
      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/planeai-plugin-linear/*' -DestinationPath '${{ matrix.archive }}'
      - uses: actions/upload-artifact@v4
        with:
          name: planeai-plugin-linear-${{ matrix.platform }}
          path: ${{ matrix.archive }}

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Upload release assets
        shell: bash
        run: find artifacts -type f -print0 | xargs -0 gh release upload "${{ needs.release.outputs.tag }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Publish release
        run: gh release edit "${{ needs.release.outputs.tag }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
